# ── VollyCast — Local Development Stack ──────────────────────────────────────
# Run everything with:  docker compose up -d
# Stop everything with: docker compose down

services:

  # ── nginx RTMP ──────────────────────────────────────────────────────────────
  # Phones push to:  rtmp://<laptop-ip>:1935/live/<camera-name>
  # Watch in VLC:    http://<laptop-ip>:8080/hls/<camera-name>.m3u8
  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: vollycast-nginx-rtmp
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls-data:/tmp/hls
    restart: unless-stopped
    networks:
      - vollycast-net

  # ── VollyCast API ─────────────────────────────────────────────────────────────
  # Camera ingestion + Stream engine + Scoreboard overlay + Broadcast + Scene switcher
  vollycast-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: vollycast-api
    ports:
      - "4000:4000"   # REST API
      - "3001:3001"   # Scoreboard overlay (OBS browser source)
    environment:
      - NODE_ENV=production
      - RTMP_HOST=nginx-rtmp
      - RTMP_PORT=1935
      - RECORDINGS_PATH=/recordings
      - OVERLAY_PORT=3001
      - API_PORT=4000
    volumes:
      - recordings-data:/recordings
      - hls-data:/tmp/hls
    depends_on:
      - nginx-rtmp
    restart: unless-stopped
    networks:
      - vollycast-net

  # ── Web Dashboard ─────────────────────────────────────────────────────────────
  web-dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: vollycast-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - vollycast-api
    restart: unless-stopped
    networks:
      - vollycast-net
  mobile-controller:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mobile
    container_name: vollycast-mobile
    ports:
      - "3002:3002"
    depends_on:
      - vollycast-api
    restart: unless-stopped
    networks:
      - vollycast-net
volumes:
  hls-data:
  recordings-data:

networks:
  vollycast-net:
    driver: bridge
