server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to scoreboard overlay
    location /api/ {
        proxy_pass http://vollycast-api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
