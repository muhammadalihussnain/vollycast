worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

# ── RTMP block ────────────────────────────────────────────────────────────────
# Phones push streams here on port 1935
# Stream key format: rtmp://<laptop-ip>:1935/live/<any-key>
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Allow any client to push (LAN only — not exposed to internet)
            allow publish all;
            allow play  all;

            # Re-publish each incoming stream as HLS segments
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
        }
    }
}

# ── HTTP block ────────────────────────────────────────────────────────────────
# Serves HLS playlist files so VLC / browsers can play the streams
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8080;

        # HLS stream endpoint
        # Play a stream at: http://<laptop-ip>:8080/hls/<key>.m3u8
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Health check
        location /health {
            return 200 'nginx-rtmp ok';
            add_header Content-Type text/plain;
        }
    }
}
